name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on insecure http:// in source
        run: |
          if grep -rn "http://" src public scripts 2>/dev/null | grep -vE 'localhost|127\.0\.0\.1|www\.w3\.org'; then
            echo "Insecure http:// URLs found in source"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e engine
      - run: python -m pytest engine -q
