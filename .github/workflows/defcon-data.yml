name: DEFCON data build

# Twice-daily successor of the old ISR-only refresh: computes DEFCON profiles
# and commits public/data/defcon_gw{N}.json; the push triggers the Netlify deploy.
on:
  schedule:
    - cron: '10 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsx scripts/build-defcon-data.ts

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/defcon_gw*.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update DEFCON data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
